  <rect x="60" y="60" width="1080" height="660" rx="28" fill="#ffffff" stroke="#d1d1d6" stroke-width="2" stroke-dasharray="12 9"/>
  <circle cx="600" cy="300" r="72" fill="#007aff" opacity="0.12"/>
  <path d="M572 300 a28 28 0 1 0 56 0 a28 28 0 1 0 -56 0" fill="none" stroke="#007aff" stroke-width="8"/>
