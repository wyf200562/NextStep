  <rect x="60" y="60" width="1080" height="660" rx="28" fill="#ffffff" stroke="#d1d1d6" stroke-width="2" stroke-dasharray="12 9"/>
  <rect x="500" y="240" width="200" height="40" rx="20" fill="#007aff" opacity="0.16"/>
  <text x="600" y="268" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#007aff">面试</text>
  <text x="600" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="40" font-weight="700" fill="#1c1c1e">申请详情截图占位</text>
